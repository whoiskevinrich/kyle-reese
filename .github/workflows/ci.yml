name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KyleReese.slnx

      - name: Build
        run: dotnet build KyleReese.slnx -c Release --no-restore

      - name: Test
        run: dotnet test KyleReese.slnx -c Release --no-build --verbosity normal
