name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed to push tags and create releases.
permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the version can be computed from commits.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build KyleReese.slnx -c Release

      - name: Test
        run: dotnet test KyleReese.slnx -c Release --no-build --verbosity normal

      # Computes the next semantic version from conventional-commit history since the last
      # tag (feat: -> minor, fix: -> patch, BREAKING CHANGE -> major) and creates the tag.
      # Falls back to a patch bump for non-conventional commits.
      - name: Compute version and tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Publish single-file exe
        run: >
          dotnet publish src/KyleReese/KyleReese.csproj -c Release -o publish
          -p:Version=${{ steps.tag.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: publish/KyleReese.exe
